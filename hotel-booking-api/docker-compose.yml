name: lab12-project-${STUDENT_ID:?set STUDENT_ID in .env}

x-database-url: &database-url mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}

services:
  app:
    build:
      context: .
      target: runtime
    image: hotel-booking-api:lab12
    ports:
      - "127.0.0.1:8090:3000"
    environment:
      PORT: 3000
      DATABASE_URL: *database-url
      REDIS_URL: redis://cache:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # runs prisma migrate deploy once, then exits
  migrate:
    build:
      context: .
      target: migrate
    image: hotel-booking-api:lab12-migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - talia_safehouse:/var/lib/mysql
    healthcheck:
      # TCP on purpose: the first-run temporary server only listens on the socket
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Room cache only, so no volume. Losing it just means the next GET hits MySQL.
  cache:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  talia_safehouse:
