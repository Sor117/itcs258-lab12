name: lab12-express-${STUDENT_ID:?set STUDENT_ID in .env}

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8082:3000"
    environment:
      PORT: 3000
      APP_MESSAGE: ${APP_MESSAGE:-Hello from Compose Express}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # postgres 18+ keeps data under /var/lib/postgresql/18/docker, so mount the parent
      - capricorn_vault:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 so the temporary socket-only server during first init doesn't count as ready
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  capricorn_vault:
